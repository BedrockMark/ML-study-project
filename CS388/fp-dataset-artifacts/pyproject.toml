[project]
name = "fp-dataset-artifacts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mark Liu", email = "lbigjoybigl@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets<3.0.0",
    "evaluate>=0.4.6",
    "huggingface-hub<0.24.0",
    "matplotlib>=3.11.2",
    # "torch>=2.14.1",
    "torch",
    "tqdm>=4.70.1",
    "transformers<4.45.0",
]

# Pytorch for CUDA 121
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[project.scripts]
fp-dataset-artifacts = "fp_dataset_artifacts:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
